# docker/compose.yaml
services:
  postgres:
    image: postgres:16-alpine
    container_name: shopease-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    env_file:
      - ../.env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: shopease-minio
    restart: unless-stopped
    ports:
      - "19000:9000"
      - "19001:9001"
    env_file:
      - ../.env
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: shopease-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ../.env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      for b in bronze silver gold landing; do
        mc mb --ignore-existing local/$$b;
      done &&
      mc anonymous set download local/landing &&
      echo 'minio-init: buckets ready'
      "
    restart: "no"

  kafka:
    image: apache/kafka:3.9.0
    container_name: shopease-kafka
    restart: unless-stopped
    ports:
      - "19092:19092"   # EXTERNAL listener — for host clients (your laptop)
    environment:
      # --- Identity ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

      # --- Listeners (the dual-listener pattern) ---
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # --- Single-broker sanity (production would use 3+) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Behavior ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # force explicit topic creation
      KAFKA_LOG_RETENTION_HOURS: 24              # disk guard
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: shopease-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      KT=/opt/kafka/bin/kafka-topics.sh &&
      $$KT --bootstrap-server kafka:9092 --create --if-not-exists --topic shopease.public.customers --partitions 3 --replication-factor 1 &&
      $$KT --bootstrap-server kafka:9092 --create --if-not-exists --topic shopease.public.orders    --partitions 3 --replication-factor 1 &&
      $$KT --bootstrap-server kafka:9092 --create --if-not-exists --topic shopease.events.pageviews --partitions 3 --replication-factor 1 &&
      echo 'kafka-init: topics ready'
      "
    restart: "no"

volumes:
  pg_data:
  minio_data:
  kafka_data: