# docker/compose.yaml
# Run from repo root:  docker compose -f docker/compose.yaml up -d postgres
# Or via Makefile:     make up
services:
  postgres:
    image: postgres:16-alpine
    container_name: shopease-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    env_file:
      - ../.env
    environment:
      # Map .env names → Postgres's expected env var names
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical          # Phase 2 (Debezium) will need this
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: shopease-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../.env
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: shopease-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ../.env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      for b in bronze silver gold landing; do
        mc mb --ignore-existing local/$$b;
      done &&
      mc anonymous set download local/landing &&
      echo 'minio-init: buckets ready'
      "
    restart: "no"